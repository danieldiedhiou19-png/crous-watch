name: Surveillance logement CROUS

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer la verification
        env:
          CROUS_CITY: "Grenoble,La Tronche,Saint-Martin-d'Heres,Gieres,Echirolles,Fontaine"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crous_watch.py

      - name: Sauvegarder l'etat (logements deja vus)
        run: |
          git config user.name "crous-watch-bot"
          git config user.email "actions@github.com"
          git add seen_listings.json
          git diff --quiet --cached || git commit -m "Mise a jour des logements vus"
          git push
